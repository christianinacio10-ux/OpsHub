<script>
(function () {
  'use strict';

  var Estado = {
    vista: 'hub',
    contexto: null,
    hub: null,
    carregando: false,
    deptAberto: null,
    pastasAbertas: {},
    configAba: 'dept',
    filtros: filtrosVazios(),
    filtroAberto: null,
    ordem: { campo: 'prazo', dir: 'asc' },
    form: { tipo: '', data: {} },
    formDrawer: { tipo: '', data: {} },
    deptModo: 'ver',
    aparenciaAberta: false,
    arrastouDept: false,
    dragId: null,
    idioma: 'pt',
  };

  var ICONES_DEPT = [
    'producao', 'qualidade', 'manutencao', 'ehs',
    'logistica', 'engenharia', 'pcp', 'melhoria',
  ];

  function filtrosVazios() {
    return {
      texto: '',
      temas: [],
      todosTemas: false,
      divisoes: null,
      areas: null,
      statuses: null,
      responsaveis: null,
      omitirEncerradas: true,
    };
  }

    /* Glifos Lucide (ISC) embutidos — Apps Script nao pode puxar CDN. */
    var ICONES = {
      menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
      tela: '<path d="M8 3H4v4M16 3h4v4M8 21H4v-4M16 21h4v-4"/>',
      atualizar: '<path d="M4.5 12a7.5 7.5 0 0 1 12.7-5.4M19.5 12a7.5 7.5 0 0 1-12.7 5.4"/><path d="M17 3.5v4h-4M7 20.5v-4h4"/>',
      producao: '<path d="M11 10.27 7 3.34"/><path d="m11 13.73-4 6.93"/><path d="M12 22v-2"/><path d="M12 2v2"/><path d="M14 12h8"/><path d="m17 20.66-1-1.73"/><path d="m17 3.34-1 1.73"/><path d="M2 12h2"/><path d="m20.66 17-1.73-1"/><path d="m20.66 7-1.73 1"/><path d="m3.34 17 1.73-1"/><path d="m3.34 7 1.73 1"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="8"/>',
      qualidade: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
      manutencao: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/>',
      ehs: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      logistica: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
      engenharia: '<path d="m12.99 6.74 1.93 3.44"/><path d="M19.136 12a10 10 0 0 1-14.271 0"/><path d="m21 21-2.16-3.84"/><path d="m3 21 8.02-14.26"/><circle cx="12" cy="5" r="2"/>',
      pcp: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
      melhoria: '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
    geral: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    config: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    pasta: '<path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
    'pasta-aberta': '<path d="M3 7h6l2 2h10v2H4l-1 8V7z"/><path d="M3 19h16l2-8H5"/>',
    arquivo: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
    ajuda: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.4-1.4 1-1.4 1.9V14M12 17h.01"/>',
  };

  function svg(nome, extra) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' +
      (ICONES[nome] || ICONES.geral) + '</svg>' + (extra || '');
  }

  function $(id) { return document.getElementById(id); }

  function t(chave, vars) {
    if (typeof I18n === 'undefined') return chave;
    return I18n.t(Estado.idioma, chave, vars);
  }

  function localeUi() {
    return typeof I18n !== 'undefined' ? I18n.locale(Estado.idioma) : 'pt-BR';
  }

  function rotuloStatusUi(status) {
    return typeof I18n !== 'undefined' ? I18n.rotuloStatus(Estado.idioma, status) : String(status == null ? '' : status);
  }

  function idiomaInicial() {
    try {
      var salvo = localStorage.getItem(typeof I18n !== 'undefined' ? I18n.CHAVE : 'opshub_idioma');
      if (salvo && typeof I18n !== 'undefined') return I18n.normalizar(salvo);
    } catch (e) {}
    return typeof I18n !== 'undefined' ? I18n.detectarNavegador() : 'pt';
  }

  function aplicarChrome() {
    if (typeof I18n !== 'undefined') {
      document.documentElement.lang = I18n.htmlLang(Estado.idioma);
    }
    var sub = $('marca-sub');
    if (sub) sub.textContent = t('marca_sub');
    var btnAt = $('botao-atualizar');
    if (btnAt) {
      btnAt.innerHTML = svg('atualizar') + ' ' + t('atualizar');
      btnAt.title = t('atualizar');
      if (Estado.carregando) btnAt.disabled = true;
    }
    var btnTela = $('botao-tela');
    if (btnTela) btnTela.title = t('tela_cheia');
    var btnSide = $('botao-sidebar');
    if (btnSide) btnSide.title = t('recolher_menu');
    var btnFechar = $('drawer-fechar');
    if (btnFechar) {
      btnFechar.title = t('fechar');
      btnFechar.textContent = t('fechar');
    }
    var user = $('usuario-nome');
    if (user && user.getAttribute('data-ph') === '1') user.textContent = t('carregando');
    var sw = $('idioma-switch');
    if (sw) sw.setAttribute('aria-label', t('aria_idioma'));
    Array.prototype.forEach.call(document.querySelectorAll('[data-idioma]'), function (b) {
      b.classList.toggle('ativo', b.getAttribute('data-idioma') === Estado.idioma);
    });
    var pilula = $('pilula-texto');
    if (pilula && typeof I18n !== 'undefined' && !Estado.carregando) {
      var atualPilula = pilula.textContent;
      ['atualizado', 'sincronizando', 'erro', 'atualizando'].forEach(function (chave) {
        I18n.IDIOMAS.forEach(function (lang) {
          if (atualPilula === I18n.t(lang, chave)) pilula.textContent = t(chave);
        });
      });
    }
  }

  function definirIdioma(codigo) {
    Estado.idioma = typeof I18n !== 'undefined' ? I18n.normalizar(codigo) : 'pt';
    try { localStorage.setItem(typeof I18n !== 'undefined' ? I18n.CHAVE : 'opshub_idioma', Estado.idioma); } catch (e) {}
    aplicarChrome();
    render();
    if (Estado.deptAberto) abrirDept(Estado.deptAberto.id, Estado.deptModo);
    chamar('apiSalvarIdioma', Estado.idioma).catch(function () {});
  }

  function escapar(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function tituloNome(v) {
    return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().split(' ')
      .filter(Boolean)
      .map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase(); })
      .join(' ');
  }

  function chamar(nome) {
    var a = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      try {
        if (a.length === 0) r[nome]();
        else if (a.length === 1) r[nome](a[0]);
        else if (a.length === 2) r[nome](a[0], a[1]);
        else r[nome](a[0], a[1], a[2]);
      } catch (err) {
        reject(err);
      }
    });
  }

  function toast(msg, erro) {
    var el = $('toast');
    el.hidden = false;
    el.className = 'toast' + (erro ? ' erro' : '');
    el.textContent = msg;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.hidden = true; }, 4200);
  }

  function ocupar(ligado, texto, sub) {
    Estado.carregando = !!ligado;
    var overlay = $('overlay-carga');
    var botao = $('botao-atualizar');
    if (overlay) overlay.hidden = !ligado;
    if ($('overlay-texto') && texto) $('overlay-texto').textContent = texto;
    if ($('overlay-sub')) {
      $('overlay-sub').textContent = ligado ? (sub || t('aguardar')) : '';
      $('overlay-sub').hidden = !ligado;
    }
    if (botao) {
      botao.disabled = !!ligado;
      if (ligado) botao.classList.add('ocupado');
      else botao.classList.remove('ocupado');
    }
    if (ligado) setPilula(null, texto || t('atualizando'));
  }

  function mensagemImportacao(imp) {
    if (!imp) return '';
    var avisos = (imp.avisos || []).join(' · ');
    if (!imp.fontes) return avisos || t('toast_sem_fonte');
    var base = imp.linhas
      ? t('toast_importacao', {
        linhas: imp.linhas,
        fontes: imp.fontes,
        sLinha: imp.linhas === 1 ? '' : 's',
        sFonte: imp.fontes === 1 ? '' : 's',
      })
      : t('toast_importacao_vazia');
    return avisos ? base + ' ' + avisos : base;
  }

  function aplicarHub(hub, imp) {
    Estado.hub = hub;
    ocupar(false);
    setPilula(true, t('atualizado'));
    render();
    var msg = mensagemImportacao(imp || hub.importacao);
    if (msg) toast(msg, !!(imp || hub.importacao) && (imp || hub.importacao).linhas === 0);
  }

  function setPilula(ok, texto) {
    var p = $('pilula-estado');
    p.className = 'pilula' + (ok === true ? ' ok' : ok === false ? ' erro' : '');
    $('pilula-texto').textContent = texto;
  }

  function iconeNav(nome) {
    var mapa = { hub: 'geral', planos: 'pcp', config: 'config' };
    return svg(mapa[nome] || 'geral');
  }

  function renderNav() {
    var itens = [
      ['hub', t('nav_hub')],
      ['planos', t('nav_planos')],
      ['config', t('nav_config')],
    ];
    $('nav').innerHTML =
      '<div class="nav-titulo">' + t('nav_navegar') + '</div>' +
      itens.map(function (it) {
        return '<button type="button" class="nav-item' + (Estado.vista === it[0] ? ' ativo' : '') +
          '" data-vista="' + it[0] + '">' + iconeNav(it[0]) + '<span>' + it[1] + '</span></button>';
      }).join('');
  }

  function titulos() {
    var mapa = {
      hub: [t('nav_hub'), t('topo_hub_sub')],
      planos: [t('nav_planos'), t('topo_planos_sub')],
      config: [t('nav_config'), t('topo_config_sub')],
    };
    var tit = mapa[Estado.vista] || mapa.hub;
    $('topo-titulo').textContent = tit[0];
    $('topo-sub').textContent = tit[1];
  }

  function kpisHtml(k) {
    k = k || { total: 0, abertos: 0, atrasados: 0, semEmail: 0, concluidos: 0 };
    return '<div class="kpis">' +
      kpi(t('kpi_acoes'), k.total) +
      kpi(t('kpi_aberto'), k.abertos) +
      kpi(t('kpi_atrasadas'), k.atrasados, 'risco') +
      kpi(t('kpi_sem_email'), k.semEmail, 'alerta') +
      kpi(t('kpi_concluidas'), k.concluidos, 'ok') +
      '</div>';
  }
  function kpi(rotulo, valor, cls) {
    return '<div class="kpi' + (cls ? ' ' + cls : '') + '"><div class="kpi-rotulo">' +
      rotulo + '</div><div class="kpi-valor">' + valor + '</div></div>';
  }

  function deptCards() {
    var hub = Estado.hub;
    var controles = hub.controles || [];
    return '<div class="secao-cab"><div><div class="secao-titulo">' + t('hub_titulo') + '</div>' +
      '<div class="secao-apoio">' + t('hub_apoio') + '</div></div></div>' +
      '<div class="grade-dept">' +
      (hub.departamentos || []).map(function (d) {
        var n = controles.filter(function (c) { return c.departamento_id === d.id; }).length;
        var badge = d.bandeira
          ? '<span class="card-dept-badge">' + escapar(d.bandeira) + '</span>'
          : '';
        return '<article class="card-dept" data-dept="' + escapar(d.id) +
          '" style="--dept-cor:' + escapar(d.cor) + '" draggable="true" tabindex="0">' +
          '<div class="card-dept-acoes">' +
          badge +
          '<button type="button" class="card-dept-config" data-editar-dept="' + escapar(d.id) +
          '" title="' + escapar(t('config_card_tip')) + '">' + svg('config') + '</button>' +
          '</div>' +
          '<div class="card-dept-topo">' +
          '<div class="card-dept-icone">' + svg(d.icone) + '</div>' +
          '</div>' +
          '<h3>' + escapar(d.nome) + '</h3>' +
          '<p>' + escapar(d.descricao) + '</p>' +
          '<div class="card-dept-meta"><span>' + (n === 1 ? t('n_controle', { n: n }) : t('n_controles', { n: n })) +
          '</span>' + t('abrir') + '</div></article>';
      }).join('') + '</div>';
  }

  function unicos(lista, campo) {
    var set = {}; var out = [];
    var n = lista && lista.length;
    if (typeof n !== 'number') return out;
    for (var i = 0; i < n; i++) {
      var p = lista[i];
      var v = p && p[campo];
      if (!v || set[v]) continue;
      set[v] = 1; out.push(v);
    }
    out.sort(function (a, b) { return String(a).localeCompare(String(b), localeUi()); });
    return out;
  }

  function chaveFiltro(eixo) {
    return { divisao: 'divisoes', area: 'areas', status: 'statuses', responsavel: 'responsaveis' }[eixo];
  }

  function passaEixoUi(selecionados, valor) {
    if (selecionados == null) return true;
    if (!selecionados.length) return false;
    return selecionados.indexOf(valor) !== -1;
  }

  function statusEncerradoUi(status) {
    if (typeof Logica !== 'undefined' && Logica.encerrada) return Logica.encerrada(status);
    var s = String(status == null ? '' : status)
      .toLowerCase()
      .replace(/\u00a0/g, ' ');
    try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (err) {}
    s = s.replace(/[^a-z0-9]+/g, ' ').trim();
    var partes = s.split(' ');
    var i, w;
    for (i = 0; i < partes.length; i++) {
      w = partes[i];
      if (!w) continue;
      if (w.indexOf('cancelad') === 0 || w === 'cancelled' || w === 'canceled' || w === 'cancel') return true;
      if (w.indexOf('concluid') === 0 || w === 'done' || w === 'closed' || w === 'complete') return true;
    }
    return false;
  }

  function statusMarcado(valor) {
    var f = Estado.filtros;
    if (f.statuses != null) return f.statuses.indexOf(valor) !== -1;
    if (f.omitirEncerradas) return !statusEncerradoUi(valor);
    return true;
  }

  function rotuloFiltroStatus(valores) {
    var f = Estado.filtros;
    var marcados = (valores || []).filter(statusMarcado);
    if (!valores.length) return t('filtro_status');
    if (f.statuses == null && f.omitirEncerradas) return t('status_ativas');
    if (marcados.length === valores.length) return t('filtro_status');
    if (!marcados.length) return t('status_nenhum');
    if (marcados.length === 1) return rotuloStatusUi(marcados[0]);
    return t('filtro_status') + ' (' + marcados.length + ')';
  }

  function temasAtivos(todosTemasUnicos) {
    var f = Estado.filtros;
    if (f.todosTemas) return todosTemasUnicos.slice();
    return f.temas || [];
  }

  function todosTemasMarcados(todosTemasUnicos) {
    var ativos = temasAtivos(todosTemasUnicos);
    return !!todosTemasUnicos.length && ativos.length === todosTemasUnicos.length;
  }

  function aplicaFiltros(lista) {
    var f = Estado.filtros;
    var temasPossiveis = unicos(lista, 'tema');
    var temas = temasAtivos(temasPossiveis);
    if (!temas.length) return [];
    var q = (f.texto || '').toLowerCase();
    return (lista || []).filter(function (p) {
      if (temas.indexOf(p.tema) === -1) return false;
      if (!passaEixoUi(f.divisoes, p.divisao)) return false;
      if (!passaEixoUi(f.areas, p.area)) return false;
      if (f.statuses != null) {
        if (!passaEixoUi(f.statuses, p.status)) return false;
      } else if (f.omitirEncerradas && statusEncerradoUi(p.status)) {
        return false;
      }
      if (!passaEixoUi(f.responsaveis, p.responsavel)) return false;
      if (!q) return true;
      return [p.tema, p.divisao, p.area, p.oque, p.como, p.responsavel, p.email, p.status, p.comentarios]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function eixoMarcado(selecionados, valor, total) {
    if (selecionados == null || (total && selecionados.length === total.length)) return true;
    return selecionados.indexOf(valor) !== -1;
  }

  function rotuloExcel(label, selecionados, valores) {
    if (selecionados == null || !valores.length || selecionados.length === valores.length) return label;
    if (!selecionados.length) return t('filtro_nenhum', { label: label });
    if (selecionados.length === 1) return selecionados[0];
    return label + ' (' + selecionados.length + ')';
  }

  function painelExcel(eixo, label, valores) {
    var chave = chaveFiltro(eixo);
    var sel = Estado.filtros[chave];
    var aberto = Estado.filtroAberto === eixo;
    var todosOn;
    var rotulo;
    if (eixo === 'status') {
      todosOn = !valores.length || valores.every(statusMarcado);
      rotulo = rotuloFiltroStatus(valores);
    } else {
      todosOn = sel == null || (sel && sel.length === valores.length && valores.length);
      rotulo = rotuloExcel(label, sel, valores);
    }
    var itens = valores.map(function (v) {
      var on = eixo === 'status' ? statusMarcado(v) : eixoMarcado(sel, v, valores);
      return '<button type="button" class="filtro-excel-item" data-filtro-valor="' + escapar(v) +
        '" data-filtro-eixo="' + eixo + '">' +
        '<span class="caixa' + (on ? ' marcada' : '') + '" aria-hidden="true"></span>' +
        '<span>' + escapar(eixo === 'status' ? rotuloStatusUi(v) : v) + '</span></button>';
    }).join('');
    return '<div class="filtro-excel' + (aberto ? ' aberto' : '') + '">' +
      '<button type="button" class="filtro-excel-btn" data-abrir-filtro="' + eixo +
      '" aria-expanded="' + (aberto ? 'true' : 'false') + '">' +
      escapar(rotulo) +
      '<span class="filtro-excel-seta">▾</span></button>' +
      (aberto
        ? '<div class="filtro-excel-painel" role="listbox">' +
          '<button type="button" class="filtro-excel-item todos" data-filtro-todos="' + eixo + '">' +
          '<span class="caixa' + (todosOn ? ' marcada' : '') + '" aria-hidden="true"></span>' +
          '<span>' + t('selecionar_todos') + '</span></button>' +
          (itens || '<div class="filtro-excel-vazio">' + t('sem_valores') + '</div>') +
          '</div>'
        : '') +
      '</div>';
  }

  function chipsTema(todos) {
    var temas = unicos(todos, 'tema');
    var ativos = temasAtivos(temas);
    var set = {};
    ativos.forEach(function (t) { set[t] = 1; });
    var todosOn = todosTemasMarcados(temas);
    return '<div class="temas-barra">' +
      '<div class="secao-titulo" style="font-size:13px;margin-bottom:8px">' + t('filtrar_tema') + '</div>' +

  function aplicaOrdem(lista) {
    var campo = Estado.ordem.campo;
    var dir = Estado.ordem.dir === 'desc' ? -1 : 1;
    return lista.slice().sort(function (a, b) {
      var va = a[campo] || '';
      var vb = b[campo] || '';
      if (campo === 'prazo') { va = a.prazo || ''; vb = b.prazo || ''; }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  }

  function td(valor, cls) {
    var t = valor == null ? '' : String(valor);
    return '<td' + (cls ? ' class="' + cls + '"' : '') + ' title="' + escapar(t) + '">' + escapar(t) + '</td>';
  }

  function th(campo, rotulo) {
    var ativo = Estado.ordem.campo === campo;
    return '<th data-ord="' + campo + '">' + rotulo +
      (ativo ? '<span class="ord">' + (Estado.ordem.dir === 'asc' ? '↑' : '↓') + '</span>' : '') +
      '</th>';
  }

  function tabelaPlanos() {
    var todos = Estado.hub.planos || [];
    var temasPossiveis = unicos(todos, 'tema');
    var semTema = !temasAtivos(temasPossiveis).length;
    var filtrados = semTema ? [] : aplicaOrdem(aplicaFiltros(todos));
    var cab =
      '<div class="painel-topo">' +
      '<input class="busca" id="filtro-texto" placeholder="' + escapar(t('busca_ph')) + '" value="' +
      escapar(Estado.filtros.texto) + '">' +
      painelExcel('divisao', t('filtro_divisao'), unicos(todos, 'divisao')) +
      painelExcel('area', t('filtro_area'), unicos(todos, 'area')) +
      painelExcel('status', t('filtro_status'), unicos(todos, 'status')) +
      painelExcel('responsavel', t('filtro_responsavel'), unicos(todos, 'responsavel')) +
      '<button type="button" class="botao" id="limpar-filtros">' + t('limpar') + '</button>' +
      '</div>';

    var vazioMsg = semTema
      ? t('vazio_tema')
      : t('vazio_filtros');

    if (!filtrados.length) {
      return '<div class="painel painel-planos">' + cab + '<div class="vazio">' + vazioMsg + '</div></div>';
    }

    var linhas = filtrados.map(function (p) {
      var tipEmail = p.tem_email ? p.email : t('tooltip_sem_email');
      var emailCel = p.tem_email
        ? escapar(p.email)
        : '<span class="aviso-email" tabindex="0" data-tip="' + escapar(tipEmail) +
          '" title="' + escapar(tipEmail) + '">' + svg('ehs') + '</span>';
      var stLabel = rotuloStatusUi(p.status);
      return '<tr class="' + (p.status_classe === 'risco' ? 'risco' : '') + '">' +
        td(p.tema) +
        td(p.divisao) +
        td(p.area) +
        td(p.oque, 'principal') +
        td(p.como, 'como') +
        td(p.responsavel) +
        '<td title="' + escapar(tipEmail) + '">' + emailCel + '</td>' +
        td(p.prazo_br) +
        '<td title="' + escapar(stLabel) + '"><span class="selo ' + p.status_classe + '">' + escapar(stLabel) + '</span></td>' +
        td(p.comentarios, 'comentarios') +
        '</tr>';
    }).join('');

    return '<div class="painel painel-planos">' + cab +
      '<div class="tabela-wrap"><table class="dados"><thead><tr>' +
      th('tema', t('th_tema')) + th('divisao', t('th_divisao')) + th('area', t('th_area')) +
      th('oque', t('th_oque')) + th('como', t('th_como')) + th('responsavel', t('th_responsavel')) +
      th('email', t('th_email')) + th('prazo', t('th_prazo')) + th('status', t('th_status')) +
      th('comentarios', t('th_comentarios')) +
      '</tr></thead><tbody>' + linhas + '</tbody></table></div>' +
      '<div class="painel-topo tabela-rodape" style="border-top:1px solid var(--linha);border-bottom:0">' +
      '<div class="secao-apoio">' + t('n_acoes', { n: filtrados.length, total: todos.length }) + '</div></div></div>';
  }

  function negocioEfetivo(c, dept) {
    var n = String((c && c.negocio) || '').trim();
    if (n === 'Apparel' || n === 'Smartrac' || n === 'Solutions') return n;
    var b = String((dept && dept.bandeira) || '').trim();
    if (b === 'Apparel' || b === 'Smartrac') return b;
    return 'Solutions';
  }

  function montarArvoreUi(controles) {
    var raiz = { nome: '', filhos: {}, arquivos: [] };
    (controles || []).forEach(function (c) {
      var no = raiz;
      String(c.pasta || '').split('/').map(function (p) { return p.trim(); }).filter(Boolean).forEach(function (p) {
        if (!no.filhos[p]) no.filhos[p] = { nome: p, filhos: {}, arquivos: [] };
        no = no.filhos[p];
      });
      no.arquivos.push(c);
    });
    function ser(no) {
      return {
        nome: no.nome,
        pastas: Object.keys(no.filhos).sort(function (a, b) { return a.localeCompare(b, localeUi()); })
          .map(function (k) { return ser(no.filhos[k]); }),
        arquivos: (no.arquivos || []).slice().sort(function (a, b) {
          var dlt = Number(a.ordem || 0) - Number(b.ordem || 0);
          return dlt || String(a.nome || '').localeCompare(String(b.nome || ''), localeUi());
        }),
      };
    }
    return ser(raiz);
  }

  function htmlArvore(no, prefixo) {
    var html = '';
    (no.pastas || []).forEach(function (p) {
      var chave = prefixo ? prefixo + '/' + p.nome : p.nome;
      var aberta = Estado.pastasAbertas[chave] !== false;
      html += '<div class="arvore-no">' +
        '<button type="button" class="arvore-pasta" data-pasta-toggle="' + escapar(chave) + '">' +
        svg(aberta ? 'pasta-aberta' : 'pasta') +
        '<span>' + escapar(p.nome) + '</span></button>' +
        (aberta ? '<div class="arvore-filhos">' + htmlArvore(p, chave) + '</div>' : '') +
        '</div>';
    });
    (no.arquivos || []).forEach(function (c) {
      html += '<a class="arvore-arquivo" href="' + escapar(c.url || '#') + '" target="_blank" rel="noopener">' +
        svg('arquivo') +
        '<span><strong>' + escapar(c.nome) + '</strong>' +
        (c.descricao ? '<em>' + escapar(c.descricao) + '</em>' : '') +
        '</span></a>';
    });
    return html;
  }

  function blocoArvore(titulo, controles) {

    return '<div class="arvore-col">' +
      (titulo ? '<div class="arvore-col-titulo">' + escapar(titulo) + '</div>' : '') +
      '<div class="arvore-col-corpo">' + inner + '</div></div>';

  function abrirDept(id, modo) {
    var d = (Estado.hub.departamentos || []).filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    modo = modo || Estado.deptModo || 'ver';
    if (!Estado.deptAberto || Estado.deptAberto.id !== id) {
      Estado.pastasAbertas = {};
      Estado.formDrawer = { tipo: '', data: {} };
      Estado.aparenciaAberta = false;
    }
    Estado.deptAberto = d;
    Estado.deptModo = modo;
    var links = (Estado.hub.controles || []).filter(function (c) { return c.departamento_id === id; });
    var bandeira = d.bandeira || '';
    var solutions = bandeira === 'Solutions';
    $('drawer').classList.remove('largo', 'extra-largo');
    if (modo === 'editar') {
      $('drawer-kicker').textContent = bandeira
        ? t('drawer_configurar_bandeira', { bandeira: bandeira })
        : t('drawer_configurar');
      $('drawer-titulo').textContent = d.nome;
      $('drawer-sub').textContent = t('drawer_sub_editar');
      $('drawer-corpo').innerHTML =
        '<div class="drawer-gestao">' +
        '<div class="secao-titulo">' + t('drawer_arquivos_titulo') + '</div>' +
        '<div class="secao-apoio">' + t('drawer_arquivos_apoio') + '</div>' +
        formDrawerCtrl(d) +
        listaArquivosDrawer(d, links) +
        '</div>' +
        aparenciaDept(d);
    } else {
      $('drawer-kicker').textContent = bandeira
        ? t('drawer_controles_bandeira', { bandeira: bandeira })
        : t('drawer_controles');
      $('drawer-titulo').textContent = d.nome;
      $('drawer-sub').textContent = d.descricao || t('drawer_sub_ver');
      var arvores;
      if (solutions) {
        $('drawer').classList.add('extra-largo');
        arvores = '<div class="arvores-triplas">' +
          blocoArvore('Apparel', links.filter(function (c) { return negocioEfetivo(c, d) === 'Apparel'; })) +
          blocoArvore('Smartrac', links.filter(function (c) { return negocioEfetivo(c, d) === 'Smartrac'; })) +
          blocoArvore('Solutions', links.filter(function (c) { return negocioEfetivo(c, d) === 'Solutions'; })) +
          '</div>';
      } else {
        arvores = blocoArvore(bandeira || '', links);
      }
      $('drawer-corpo').innerHTML = arvores;
    }
    $('drawer').hidden = false;
    $('drawer-fundo').hidden = false;
    $('drawer').classList.add('aberto');
    $('drawer-fundo').classList.add('aberto');
  }

      '<div class="secao-apoio">' + t('mail_regra_apoio') + '</div>' +
      chipsFollowUp() +
      '<div class="selo ' + (g.ativo ? 'ok' : 'aberto') + '">' +
      t('gatilho_selo', { estado: g.ativo ? t('gatilho_ativo') : t('gatilho_inativo'), hora: g.hora }) +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="botao primario" id="btn-gatilho">' + t('ativar_gatilho') + '</button>' +
      '<button class="botao" id="btn-remover-gatilho">' + t('inativar_gatilhos') + '</button>' +
      '<button class="botao" id="btn-followup">' + t('enviar_followups') + '</button>' +
      '</div></div></div>';
  }

  function LogicaSim(v) {
    var s = String(v || '').toLowerCase();
    return s === 'sim' || s === 'true' || s === '1' || v === true;
  }

  function render() {
    aplicarChrome();
    renderNav();
    titulos();
    var html = '';
    if (!Estado.hub) html = '<div class="esqueleto" style="height:240px"></div>';
    else if (Estado.vista === 'planos') html = vistaPlanos();
    else if (Estado.vista === 'config') html = vistaConfig();
    else html = vistaHub();
    $('conteudo').innerHTML = html;
    var area = $('area-conteudo');
    if (area) {
      if (Estado.vista === 'planos') area.classList.add('vista-planos');
      else area.classList.remove('vista-planos');
    }
  }

  function lerForm(form) {
    var d = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name) return;
      d[el.name] = el.value;
    });
    return d;
  }

  function valoresEixo(eixo) {
    var planos = (Estado.hub && Estado.hub.planos) || [];
    var campo = { divisao: 'divisao', area: 'area', status: 'status', responsavel: 'responsavel' }[eixo];
    return unicos(planos, campo);
  }

  function toggleExcelValor(eixo, valor) {
    var chave = chaveFiltro(eixo);
    var todos = valoresEixo(eixo);
    var atual = Estado.filtros[chave];
    if (eixo === 'status' && atual == null && Estado.filtros.omitirEncerradas) {
      atual = todos.filter(function (v) { return !statusEncerradoUi(v); });
    }
    var set;
    if (atual == null) {
      set = todos.filter(function (v) { return v !== valor; });
    } else if (atual.indexOf(valor) !== -1) {
      set = atual.filter(function (v) { return v !== valor; });
    } else {
      set = atual.concat([valor]);
    }
    if (eixo === 'status') Estado.filtros.omitirEncerradas = false;
    Estado.filtros[chave] = set.length === todos.length ? null : set;
  }

  function toggleExcelTodos(eixo) {
    var chave = chaveFiltro(eixo);
    var todos = valoresEixo(eixo);
    if (eixo === 'status') {
      var todosOn = !todos.length || todos.every(statusMarcado);
      Estado.filtros.statuses = null;
      Estado.filtros.omitirEncerradas = !!todosOn;
      return;
    }
    var atual = Estado.filtros[chave];
    var todosOn = atual == null || (todos.length && atual.length === todos.length);
    Estado.filtros[chave] = todosOn ? [] : null;
  }

  function toggleTema(nome) {
    var todos = unicos((Estado.hub && Estado.hub.planos) || [], 'tema');
    var ativos = temasAtivos(todos);
    var idx = ativos.indexOf(nome);
    var proximo = idx === -1
      ? ativos.concat([nome])
      : ativos.filter(function (t) { return t !== nome; });
    Estado.filtros.todosTemas = !!todos.length && proximo.length === todos.length;
    Estado.filtros.temas = Estado.filtros.todosTemas ? todos.slice() : proximo;
  }

  function marcarTodosTemas() {
    var todos = unicos((Estado.hub && Estado.hub.planos) || [], 'tema');
    if (todosTemasMarcados(todos)) {
      Estado.filtros.todosTemas = false;
      Estado.filtros.temas = [];
    } else {
      Estado.filtros.todosTemas = true;
      Estado.filtros.temas = todos.slice();
    }
  }

  function aplicarHubMantendoDrawer(hub, imp) {
    var deptId = Estado.deptAberto && Estado.deptAberto.id;
    var modo = Estado.deptModo || 'ver';
    var formDrawer = Estado.formDrawer;
    var aparencia = Estado.aparenciaAberta;
    aplicarHub(hub, imp);
    Estado.formDrawer = formDrawer || { tipo: '', data: {} };
    Estado.deptModo = modo;
    Estado.aparenciaAberta = !!aparencia;
    if (deptId) abrirDept(deptId, modo);
  }

  function salvarDeptCampo(id, patch) {
    var d = ((Estado.hub && Estado.hub.departamentos) || []).filter(function (x) { return x.id === id; })[0] || {};
    chamar('apiSalvarDepartamento', Object.assign({}, d, patch, { id: id })).then(function (hub) {
      aplicarHubMantendoDrawer(hub);
    }).catch(function (err) { toast(err.message || err, true); });
  }

  function listaTemas(v) {
    if (v == null || v === '') return [];
    if (Array.isArray(v)) {
      return v.map(function (t) { return String(t == null ? '' : t).trim(); }).filter(Boolean);
    }
    if (typeof v === 'string') {
      try { return listaTemas(JSON.parse(v)); } catch (e) {
        var unico = v.trim();
        return unico ? [unico] : [];
      }
    }
    if (typeof v === 'object') {
      var n = v.length;
      var copiada = [];
      if (typeof n === 'number') {
        for (var i = 0; i < n; i++) {
          var s = String(v[i] == null ? '' : v[i]).trim();
          if (s) copiada.push(s);
        }
        return copiada;
      }
      var keys = [];
      for (var k in v) {
        if (Object.prototype.hasOwnProperty.call(v, k) && /^\d+$/.test(k)) keys.push(k);
      }
      if (!keys.length) return [];
      keys.sort(function (a, b) { return Number(a) - Number(b); });
      return keys.map(function (k) { return String(v[k] == null ? '' : v[k]).trim(); }).filter(Boolean);
    }
    return [];
  }

  function toggleFollowUpTema(nome) {
    if (!nome || !Estado.hub || Estado.carregando) return;
    Estado.configAba = 'mail';
    ocupar(true, t('ocupado_followup'), t('ocupado_followup_sub'));
    chamar('apiAlternarTemaFollowUp', String(nome).trim()).then(function (hub) {
      Estado.configAba = 'mail';
      aplicarHub(hub);
      toast(t('toast_followup_temas'));
    }).catch(function (err) {
      ocupar(false);
      Estado.configAba = 'mail';
      render();
      toast(err.message || err, true);
    });
  }

  function enviarFollowUpsAgoraUi() {
    if (Estado.carregando) return;
    ocupar(true, t('ocupado_preparando'));
    chamar('apiPreverFollowUps').then(function (prev) {
      if (!prev || !prev.total) {
        ocupar(false);
        toast(t('toast_nenhum_followup'));
        return null;
      }
      ocupar(false);
      if (prev.temasJaEnviadosHoje && prev.temasJaEnviadosHoje.length) {
        var ok = confirm(t('confirm_followup_hoje', { temas: prev.temasJaEnviadosHoje.join(', ') }));
        if (!ok) return null;
      }
      ocupar(true, t('ocupado_enviando'));
      return chamar('apiEnviarFollowUpsAgora', true);
    }).then(function (r) {
      if (!r) return;
      ocupar(false);
      toast(t('toast_followup', { enviados: r.enviados, pulados: r.pulados }));
    }).catch(function (err) {
      ocupar(false);
      toast(err.message || err, true);
    });
  }

  function ligar() {
    document.addEventListener('click', function (e) {
      if (e.target.closest('.ajuda-btn')) {
        e.preventDefault();
        return;
      }
      var idiomaBtn = e.target.closest('[data-idioma]');
      if (idiomaBtn) {
        e.preventDefault();
        definirIdioma(idiomaBtn.getAttribute('data-idioma'));
        return;
      }
      var gear = e.target.closest('[data-editar-dept]');
      if (gear) {
        e.preventDefault();
        e.stopPropagation();
        abrirDept(gear.getAttribute('data-editar-dept'), 'editar');
        return;
      }
      if (e.target.closest('[data-toggle-aparencia]')) {
        e.preventDefault();
        e.stopPropagation();
        Estado.aparenciaAberta = !Estado.aparenciaAberta;
        if (Estado.deptAberto) abrirDept(Estado.deptAberto.id, 'editar');
        return;
      }
      var escolher = e.target.closest('[data-escolher-icone]');
      if (escolher) {
        e.preventDefault();
        e.stopPropagation();
        salvarDeptCampo(escolher.getAttribute('data-dept-id'), { icone: escolher.getAttribute('data-escolher-icone') });
        return;
      }
      if (e.target.closest('[data-cor-input]') || e.target.closest('.cor-edicao')) {
        e.stopPropagation();
        return;
      }
      var followTema = e.target.closest('[data-followup-tema]');
      if (followTema) {
        e.preventDefault();
        e.stopPropagation();
        toggleFollowUpTema(followTema.getAttribute('data-followup-tema'));
        return;
      }
      var nav = e.target.closest('[data-vista]');
      if (nav) {
        Estado.vista = nav.getAttribute('data-vista');
        Estado.form = { tipo: '', data: {} };
        Estado.filtroAberto = null;
        render();
        return;
      }
      var ancora = e.target.closest('[data-config-aba]');
      if (ancora) {
        Estado.configAba = ancora.getAttribute('data-config-aba');
        Estado.form = { tipo: '', data: {} };
        render();
        return;
      }
      var temaTodos = e.target.closest('[data-tema-todos]');
      if (temaTodos) {
        marcarTodosTemas();
        render();
        return;
      }
      var chipTema = e.target.closest('[data-tema]');
      if (chipTema) {
        toggleTema(chipTema.getAttribute('data-tema'));
        render();
        return;
      }
      var abrirFiltro = e.target.closest('[data-abrir-filtro]');
      if (abrirFiltro) {
        var eixoAbrir = abrirFiltro.getAttribute('data-abrir-filtro');
        Estado.filtroAberto = Estado.filtroAberto === eixoAbrir ? null : eixoAbrir;
        render();
        return;
      }
      var filtroTodos = e.target.closest('[data-filtro-todos]');
      if (filtroTodos) {
        toggleExcelTodos(filtroTodos.getAttribute('data-filtro-todos'));
        render();
        return;
      }
      var filtroValor = e.target.closest('[data-filtro-valor]');
      if (filtroValor) {
        toggleExcelValor(
          filtroValor.getAttribute('data-filtro-eixo'),
          filtroValor.getAttribute('data-filtro-valor')
        );
        render();
        return;
      }
      if (Estado.filtroAberto && !e.target.closest('.filtro-excel')) {
        Estado.filtroAberto = null;
        render();
        return;
      }
      var pastaBtn = e.target.closest('[data-pasta-toggle]');
      if (pastaBtn) {
        var chavePasta = pastaBtn.getAttribute('data-pasta-toggle');
        Estado.pastasAbertas[chavePasta] = Estado.pastasAbertas[chavePasta] === false;
        if (Estado.deptAberto) abrirDept(Estado.deptAberto.id, Estado.deptModo);
        return;
      }
      var editDrawer = e.target.closest('[data-edit-ctrl-drawer]');
      if (editDrawer) {
        var idEdit = editDrawer.getAttribute('data-edit-ctrl-drawer');
        var itemEdit = ((Estado.hub && Estado.hub.controles) || []).filter(function (x) {
          return String(x.id) === String(idEdit);
        })[0] || {};
        Estado.formDrawer = { tipo: 'ctrl', data: itemEdit };
        if (Estado.deptAberto) abrirDept(Estado.deptAberto.id, 'editar');
        return;
      }
      var delDrawer = e.target.closest('[data-del-ctrl-drawer]');
      if (delDrawer) {
        if (!confirm(t('confirm_excluir_arquivo'))) return;
        var idDel = delDrawer.getAttribute('data-del-ctrl-drawer');
        chamar('apiExcluirControle', idDel).then(function (hub) {
          Estado.formDrawer = { tipo: '', data: {} };
          aplicarHubMantendoDrawer(hub);
          toast(t('toast_removido'));
        }).catch(function (err) { toast(err.message || err, true); });
        return;
      }
      if (e.target.closest('[data-form-cancelar-drawer]')) {
        Estado.formDrawer = { tipo: '', data: {} };
        if (Estado.deptAberto) abrirDept(Estado.deptAberto.id, 'editar');
        return;
      }
      var dept = e.target.closest('[data-dept]');
      if (dept) {
        if (Estado.arrastouDept) {
          Estado.arrastouDept = false;
          return;
        }
        abrirDept(dept.getAttribute('data-dept'), 'ver');
        return;
      }
      if (e.target.closest('#drawer-fechar') || e.target.closest('#drawer-fundo')) {
        e.preventDefault();
        fecharDrawer();
        return;
      }
      var ord = e.target.closest('[data-ord]');
      if (ord) {
        var campoOrd = ord.getAttribute('data-ord');
        if (Estado.ordem.campo === campoOrd) Estado.ordem.dir = Estado.ordem.dir === 'asc' ? 'desc' : 'asc';
        else { Estado.ordem.campo = campoOrd; Estado.ordem.dir = 'asc'; }
        render();
        return;
      }
      if (e.target.closest('#limpar-filtros')) {
        Estado.filtros = filtrosVazios();
        Estado.filtroAberto = null;
        render();
        return;
      }
      if (e.target.closest('#botao-sidebar')) {
        $('casca').classList.toggle('sidebar-recolhida');
        return;
      }
      if (e.target.closest('#botao-atualizar')) {
        atualizarTudo();
        return;
      }
      if (e.target.closest('#botao-tela')) {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        return;
      }
      if (e.target.closest('[data-form-cancelar]')) {
        Estado.form = { tipo: '', data: {} };
        render();
        return;
      }
      if (e.target.closest('#btn-importar')) {
        atualizarTudo();
        return;
      }
      if (e.target.closest('#btn-followup')) {
        enviarFollowUpsAgoraUi();
        return;
      }
      if (e.target.closest('#btn-gatilho')) {
        if (Estado.carregando) return;
        ocupar(true, t('ocupado_gatilho'), t('ocupado_gatilho_sub'));
        chamar('apiCriarGatilho').then(function (r) {
          ocupar(false);
          toast(t('toast_gatilho', { hora: (r.gatilho && r.gatilho.hora) || 8 }));
          if (Estado.hub) Estado.hub.gatilho = r.gatilho;
          render();
        }).catch(function (err) {
          ocupar(false);
          toast(err.message || err, true);
        });
        return;
      }
      if (e.target.closest('#btn-remover-gatilho')) {
        if (Estado.carregando) return;
        ocupar(true, t('ocupado_inativar'), t('ocupado_inativar_sub'));
        chamar('apiRemoverGatilhos').then(function (r) {
          ocupar(false);
          toast(t('toast_gatilhos_removidos'));
          if (Estado.hub) Estado.hub.gatilho = r.gatilho;
          render();
        }).catch(function (err) {
          ocupar(false);
          toast(err.message || err, true);
        });
        return;
      }
      var edit = e.target.closest('[data-edit]');
      if (edit) {
        var tipo = edit.getAttribute('data-edit');
        var id = edit.getAttribute('data-id');
        var lista = tipo === 'dept' ? (Estado.hub.departamentosAdmin || Estado.hub.departamentos)
          : Estado.hub.fontes;
        var item = (lista || []).filter(function (x) { return String(x.id) === String(id); })[0] || {};
        Estado.form = { tipo: tipo, data: item };
        Estado.configAba = tipo === 'fonte' ? 'fontes' : 'dept';
        render();
        return;
      }
      var del = e.target.closest('[data-del]');
      if (del) {
        var t2 = del.getAttribute('data-del');
        var id2 = del.getAttribute('data-id');
        if (!confirm(t('confirm_excluir'))) return;
        var api = t2 === 'dept' ? 'apiExcluirDepartamento' : 'apiExcluirFonte';
        chamar(api, id2).then(function (hub) {
          Estado.hub = hub;
          Estado.form = { tipo: '', data: {} };
          render();
          toast(t('toast_removido'));
        }).catch(function (err) { toast(err.message || err, true); });
      }
    });

    document.addEventListener('submit', function (e) {
      var form = e.target.closest('form[data-entidade]');
      if (!form) return;
      e.preventDefault();
      var d = lerForm(form);
      var tipo = form.getAttribute('data-entidade');
      var api = tipo === 'dept' ? 'apiSalvarDepartamento'
        : tipo === 'ctrl' ? 'apiSalvarControle' : 'apiSalvarFonte';
      if (api === 'apiSalvarFonte') ocupar(true, t('ocupado_importando'));
      chamar(api, d).then(function (hub) {
        Estado.form = { tipo: '', data: {} };
        if (tipo === 'ctrl' && Estado.deptAberto) {
          Estado.formDrawer = { tipo: '', data: {} };
          aplicarHubMantendoDrawer(hub, hub.importacao);
        } else {
          aplicarHub(hub, hub.importacao);
        }
        if (api !== 'apiSalvarFonte') toast(t('toast_salvo'));
      }).catch(function (err) {
        ocupar(false);
        toast(err.message || err, true);
      });
    });

    document.addEventListener('input', function (e) {
      if (e.target.id === 'filtro-texto') {
        Estado.filtros.texto = e.target.value;
        renderTabelaSo();
      }
    });
    document.addEventListener('change', function (e) {
      var cor = e.target.getAttribute && e.target.getAttribute('data-cor-input');
      if (!cor) return;
      salvarDeptCampo(cor, { cor: e.target.value });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (Estado.filtroAberto) {
          Estado.filtroAberto = null;
          render();
          return;
        }
        fecharDrawer();
        return;
      }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card-dept')) {
        if (e.target.closest('[data-editar-dept], .seletor-icone, .cor-edicao')) return;
        e.preventDefault();
        abrirDept(e.target.getAttribute('data-dept'), 'ver');
      }
    });

    document.addEventListener('dragstart', function (e) {
      var card = e.target.closest('.card-dept');
      if (!card) return;
      if (e.target.closest('button, input, label, a, .seletor-icone')) {
        e.preventDefault();
        return;
      }
      Estado.arrastouDept = false;
      Estado.dragId = card.getAttribute('data-dept');
      e.dataTransfer.setData('text/plain', Estado.dragId);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('arrastando');
    });
    document.addEventListener('dragend', function (e) {
      var card = e.target.closest('.card-dept');
      if (card) card.classList.remove('arrastando');
      Estado.dragId = null;
      setTimeout(function () { Estado.arrastouDept = false; }, 0);
    });
    document.addEventListener('dragover', function (e) {
      var grade = e.target.closest('.grade-dept');
      if (!grade || !Estado.dragId) return;
      e.preventDefault();
      Estado.arrastouDept = true;
      var card = e.target.closest('.card-dept');
      var dragging = grade.querySelector('.card-dept.arrastando');
      if (!dragging || !card || card === dragging) return;
      var rect = card.getBoundingClientRect();
      var depois = (e.clientY - rect.top) > rect.height / 2;
      if (depois) grade.insertBefore(dragging, card.nextSibling);
      else grade.insertBefore(dragging, card);
    });
    document.addEventListener('drop', function (e) {
      var grade = e.target.closest('.grade-dept');
      if (!grade) return;
      e.preventDefault();
      var ids = Array.prototype.map.call(grade.querySelectorAll('.card-dept'), function (el) {
        return el.getAttribute('data-dept');
      });
      Estado.dragId = null;
      chamar('apiReordenarDepartamentos', ids).then(function (hub) {
        aplicarHub(hub);
        toast(t('toast_ordem'));
      }).catch(function (err) { toast(err.message || err, true); });
    });
  }

  function renderTabelaSo() {
    if (Estado.vista !== 'planos') return;
    render();
    var busca = $('filtro-texto');
    if (busca) {
      busca.focus();
      var v = busca.value;
      busca.value = '';
      busca.value = v;
    }
  }

  function atualizarTudo() {
    if (Estado.carregando) return;
    ocupar(true, t('ocupado_importando'));
    return chamar('apiAtualizar').then(function (hub) {
      aplicarHub(hub, hub.importacao);
    }).catch(function (err) {
      ocupar(false);
      setPilula(false, t('erro'));
      toast(err.message || String(err), true);
    });
  }

  function carregar() {
    if (Estado.carregando) return;
    ocupar(true, t('carregando_ellipsis'));
    return chamar('apiHub').then(function (hub) {
      aplicarHub(hub);
    }).catch(function (err) {
      ocupar(false);
      setPilula(false, t('erro'));
      toast(err.message || String(err), true);
    });
  }

  function iniciar() {
    Estado.idioma = idiomaInicial();
    ligar();
    $('botao-sidebar').innerHTML = svg('menu');
    $('botao-tela').innerHTML = svg('tela');
    aplicarChrome();
    var userEl = $('usuario-nome');
    if (userEl) userEl.setAttribute('data-ph', '1');
    chamar('apiSalvarIdioma', Estado.idioma).catch(function () {});
    chamar('apiContexto').then(function (ctx) {
      Estado.contexto = ctx;
      if (userEl) {
        userEl.removeAttribute('data-ph');
        userEl.textContent = tituloNome((ctx.usuario && ctx.usuario.nome) || '');
      }
      $('usuario-iniciais').textContent = (ctx.usuario && ctx.usuario.iniciais) || '--';
      $('rodape-versao').textContent = ctx.app.nome + ' · v' + ctx.app.versao;
    }).catch(function () {});
    carregar();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
